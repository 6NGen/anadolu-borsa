# Elle tetiklenen push tanilama araci: gunluk_ozet konusuna tek test bildirimi.
# Kullanim: GitHub > Actions > "Bildirim Testi" > Run workflow.
name: Bildirim Testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install requests google-auth
      - name: Test bildirimi gonder
        working-directory: scraper
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # alarm.py import'u icin bos degerler yeterli (yalniz _erisim_token kullanilir)
          SUPABASE_URL: "https://ornek.supabase.co"
          SUPABASE_SERVICE_KEY: "kullanilmiyor"
        run: python bildirim_test.py
