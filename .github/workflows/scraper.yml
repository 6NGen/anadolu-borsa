name: Gunluk Fiyat Scraper

on:
  schedule:
    - cron: "0 20 * * 1-6"   # Her gun 23:00 TSI (Pazartesi-Cumartesi)
  workflow_dispatch:           # Elle tetiklenebilir

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklar
        run: |
          pip install -r scraper/requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Scraper calistir
        run: python scraper/scraper.py
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Yedek JSON sakla
        uses: actions/upload-artifact@v4
        with:
          name: fiyatlar-${{ github.run_id }}
          path: scraper/fiyatlar_yedek.json
          retention-days: 30
